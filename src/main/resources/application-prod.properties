# =====================================================================
# Settings used ONLINE (on Render). Switched on by the environment
# variable SPRING_PROFILES_ACTIVE=prod.
#
# No passwords are written here. Each ${...} value is read from an
# environment variable that you type into Render's "Environment" page:
#
#   DB_URL       jdbc:mysql://<host>:4000/inventory_db?sslMode=VERIFY_IDENTITY
#   DB_USERNAME  the database user (from TiDB Cloud's "Connect" box)
#   DB_PASSWORD  the database password
#   JWT_SECRET   any long random text, at least 48 characters
# =====================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${JWT_SECRET}

# Render tells the app which port to listen on through the PORT variable.
server.port=${PORT:8080}

# Keep the logs readable online
spring.jpa.show-sql=false

# A free server has little memory: keep the database connection pool small
spring.datasource.hikari.maximum-pool-size=3
