# Tests ALWAYS use the separate test database (never inventory_db)
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_test_db

# Rebuild the tables and load test data when the tests start
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test-schema.sql
spring.sql.init.data-locations=classpath:db/test-data.sql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false